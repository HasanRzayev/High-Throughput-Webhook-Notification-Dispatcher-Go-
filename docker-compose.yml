services:
  postgres:
    image: postgres:16-alpine
    container_name: dispatcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dispatcher_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dispatcher_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dispatcher-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatcher-app
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8080:8080"
    environment:
      - ENV=production
      - LOG_LEVEL=info
      - GRPC_PORT=:50051
      - HTTP_PORT=:8080
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/dispatcher_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - WORKER_CONCURRENCY=50
      - QUEUE_BUFFER_SIZE=10000
      - HTTP_CONNECT_TIMEOUT=5s
      - HTTP_TOTAL_TIMEOUT=10s
      - MAX_RETRIES=5
      - INITIAL_RETRY_INTERVAL=5s
      - MAX_RETRY_INTERVAL=1h
      - BACKOFF_MULTIPLIER=2.0
      - SCHEDULER_POLL_INTERVAL=1s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-receiver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dispatcher-mock-receiver
    entrypoint: ["/bin/mockreceiver"]
    command: ["-port", "9090", "-secret", "mock-secret-key-12345", "-fail-rate", "0.5"]
    ports:
      - "9090:9090"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: dispatcher-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

volumes:
  pgdata:
